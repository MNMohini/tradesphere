app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=1234567890
app.jwt.refresh-token-days=30

mail.tenant-id=${MAIL_TENANT_ID}
mail.client-id=${MAIL_CLIENT_ID}
mail.client-secret=${MAIL_CLIENT_SECRET}
mail.from=${MAIL_FROM}
app.auth.self-registration=false
app.auth.single-device=false
# MongoDB
spring.data.mongodb.uri=${MONGO_URI}
# TESTING ONLY: prints the forgot-password code in the console instead of emailing it
app.auth.log-reset-codes=false

app.cors.allowed-origins=*
spring.servlet.multipart.max-file-size=5MB
server.error.include-message=always
server.error.include-binding-errors=always
app.outlet.require-approval=true
app.outlet.duplicate-radius-meters=30

# =========================================================
# MICROSOFT 365 MAIL CONFIGURATION
# =========================================================

spring.mail.host=smtp.office365.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# TradeSphere sender
spring.mail.test-connection=false

spring.mail.properties.mail.debug=true
